server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: contenedores
    docker_sd_configs:                 # descubre TODOS los contenedores de Docker
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'                # Docker antepone "/" al nombre; lo quitamos
        target_label: 'servicio'       # cada log queda etiquetado con el nombre del servicio
        replacement: '${1}'
